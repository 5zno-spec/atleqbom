</style>

<body>

<div class="hud">
  <div class="stat sc"><span class="lbl">النقاط</span><b id="hScore">0</b><i class="bar"><u id="bScore"></u></i></div>

  <canvas id="c" aria-label="لوحة اللعبة"></canvas>
  <div class="ov" id="ov" hidden>
    <h1 id="ovT">أطلق بوم</h1>
    <p id="ovP">صوّب نحو بالونات بنفس اللون. كل ٣ بالونات متجاورة أو أكثر تنفجر معًا. ٥٠ مستوى تتدرج من السهل إلى الصعب.</p>
    <button id="ovB">ابدأ اللعب</button>
  </div>
  <div class="win" id="win" hidden role="status" aria-live="polite">
    <div class="card">
      <h2><span>👍</span>أحسنت<span>😊</span></h2>
      <div class="wbar" aria-hidden="true"><i id="winFill"></i></div>
    </div>
  </div>
  <div class="lose" id="lose" hidden role="alertdialog" aria-labelledby="loseT">
    <div class="card">
      <h2 id="loseT">محاولة جيدة</h2>
      <p>للأسف وصلت البالونات إلى الخط</p>
      <p class="pts">النقاط: <b id="loseS">0</b></p>
      <button class="play retry" id="loseB">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v5h5"/></svg>
        حاول مرة أخرى

    <button class="play" id="btnPlay">هيا نلعب</button>
    <span class="lvlBadge" id="lvlBadge" role="img" aria-label="المستوى الحالي">1</span>
  </div>
  <button class="ghost" id="btnReset">ابدأ من جديد</button>

<script>
(() => {
'use strict';

/* ---------- الثوابت ---------- */
const R = 20, W = 480, H = 680;
const ROWH = R * Math.sqrt(3);
const MAXR = 18, LOSE_ROW = 14;
const MAX_LEVEL = 50;

/* ---------- منحنى الصعوبة: من السهل (١) إلى الأصعب (٥٠) ---------- */
const lerp = (a, b, t) => a + (b - a) * t;
const T10 = lv => Math.min(1, Math.max(0, (lv - 10) / 40));   // يبدأ بعد المستوى ١٠
const diff = {
  colors:   lv => lv <= 2 ? 3 : lv <= 6 ? 4 : lv <= 14 ? 5 : 6,
  rows:     lv => lv <= 10 ? 4 + ((lv - 1) / 3 | 0) : Math.round(lerp(7, 10, T10(lv))),
  drop:     lv => lv <= 10 ? 10 - ((lv - 1) / 4 | 0) : Math.round(lerp(8, 3, T10(lv))),
  clump:    lv => lv <= 10 ? 0.6 - 0.02 * (lv - 1) : lerp(0.42, 0, T10(lv)),
  guide:    lv => lv <= 10 ? 320 : Math.round(lerp(320, 70, T10(lv)))
};
const tierCol = lv => lv <= 10 ? '#86e29a' : lv <= 20 ? '#ffd166' : lv <= 30 ? '#ffa94d' : lv <= 40 ? '#ff7a7a' : '#bb98ff';
const tier = lv => lv <= 10 ? 'سهل' : lv <= 20 ? 'متوسط' : lv <= 30 ? 'صعب' : lv <= 40 ? 'صعب جدًا' : 'أسطوري';
const SX = W / 2, SY = 620;
const SPEED = 16;
const PAL = [
  ['#ff7a7a', '#c4283a'], // أحمر
  ['#ffc14d', '#d9730d'], // برتقالي
  ['#86e29a', '#25984a'], // أخضر
  ['#6fd0ff', '#1b6fc4'], // أزرق
  ['#bb98ff', '#6a3fd1'], // بنفسجي
  ['#ff9ad6', '#d03a94']  // وردي
];

/* ---------- الحالة ---------- */
let grid, parity, score, level, shots, levelColors;
let cur, nxt, proj = null, ang = Math.PI / 2;
let toast = { t: 0, text: '' };
let state = 'menu';            // menu | ready | flying | won | over
let parts = [], falls = [], emojis = [], combo = 0;
const FACES = ['😃', '😊', '😄', '😂', '👍'];   // فرحان، سعيد، يضحك، لايك
let best = 0, muted = false, levelStartScore = 0;
const KEY_L = 'balloon_level', KEY_S = 'balloon_score';
function loadProgress() {
  try {
    const l = Math.min(MAX_LEVEL, Math.max(1, +localStorage.getItem(KEY_L) || 1));
    return { l, sc: +localStorage.getItem(KEY_S) || 0 };
  } catch (e) { return { l: 1, sc: 0 }; }
}
function saveProgress() { try { localStorage.setItem(KEY_L, level); localStorage.setItem(KEY_S, score); } catch (e) {} }
function clearProgress() { try { localStorage.removeItem(KEY_L); localStorage.removeItem(KEY_S); } catch (e) {} }
try { best = +localStorage.getItem('balloon_best') || 0; } catch (e) {}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr;

const $ = id => document.getElementById(id);
const ov = $('ov'), ovT = $('ovT'), ovP = $('ovP'), ovB = $('ovB');
const lose = $('lose'), loseB = $('loseB'), loseS = $('loseS');

/* ---------- الشبكة السداسية ---------- */
const off  = r => (r + parity) & 1;
const cols = r => off(r) ? 11 : 12;
const px   = (r, c) => R + c * 2 * R + (off(r) ? R : 0);
const py   = r => R + r * ROWH;
const valid = (r, c) => r >= 0 && r < MAXR && c >= 0 && c < cols(r);

function nbrs(r, c) {
  const d = off(r) ? [0, 1] : [-1, 0];
  const a = [[r, c - 1], [r, c + 1]];
  for (const dc of d) a.push([r - 1, c + dc], [r + 1, c + dc]);
  return a.filter(([rr, cc]) => valid(rr, cc));
}

function present() {
  const s = new Set();
  for (const row of grid) for (const v of row) if (v >= 0) s.add(v);
  return [...s];
}
function rndColor() {
  const p = present();
  return p.length ? p[Math.random() * p.length | 0] : 0;
}
const dropEvery = () => diff.drop(level);

// يختار لون الخلية: كلما قلّت الصعوبة زاد ميل البالونات لتتجمع بنفس اللون
function pickColor(r, c, pool) {
  if (Math.random() < diff.clump(level)) {
    const near = nbrs(r, c).map(([rr, cc]) => grid[rr][cc]).filter(v => v >= 0);
    if (near.length) return near[Math.random() * near.length | 0];
  }
  return pool[Math.random() * pool.length | 0];
}

/* ---------- بدء المستويات ---------- */
function startLevel(lv) {
  level = lv; parity = 0; shots = 0; proj = null;
  levelStartScore = score; saveProgress();
  parts = []; falls = []; emojis = []; combo = 0;
  levelColors = diff.colors(lv);
  const rows = diff.rows(lv);
  const pool = Array.from({ length: levelColors }, (_, i) => i);
  grid = Array.from({ length: MAXR }, (_, r) => new Array(cols(r)).fill(-1));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols(r); c++) grid[r][c] = pickColor(r, c, pool);
  cur = rndColor(); nxt = rndColor();
  state = 'ready';
  toast = { t: 160, text: `المستوى ${lv}` };
  hideOv(); hud(); startLoop();
}
function newGame() { score = 0; startLevel(1); }

/* ---------- المحاكاة ---------- */
function collide(x, y) {
  if (y <= R) return true;
  const r0 = Math.round((y - R) / ROWH);
  const lim = (1.8 * R) * (1.8 * R);
  for (let r = Math.max(0, r0 - 1); r <= Math.min(MAXR - 1, r0 + 1); r++) {
    const row = grid[r];
    for (let c = 0; c < row.length; c++) {
      if (row[c] < 0) continue;
      const dx = x - px(r, c), dy = y - py(r);
      if (dx * dx + dy * dy < lim) return true;
    }
  }
  return false;
}

function snap(x, y) {
  const r0 = Math.round((y - R) / ROWH);
  let best = null, bd = 1e9;
  for (let r = Math.max(0, r0 - 1); r <= Math.min(MAXR - 1, r0 + 1); r++) {
    for (let c = 0; c < cols(r); c++) {
      if (grid[r][c] >= 0) continue;
      const d = (x - px(r, c)) ** 2 + (y - py(r)) ** 2;
      if (d < bd) { bd = d; best = [r, c]; }
    }
  }
  return best;
}

function burst(x, y, ci, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 1.5 + Math.random() * 3.5;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 1, ci });
  }
}

function resolve(r, c) {
  const col = grid[r][c];
  const seen = new Set([r * 100 + c]), group = [[r, c]];
  for (let i = 0; i < group.length; i++) {
    for (const [rr, cc] of nbrs(...group[i])) {
      const k = rr * 100 + cc;
      if (!seen.has(k) && grid[rr][cc] === col) { seen.add(k); group.push([rr, cc]); }
    }
  }
  if (group.length < 3) return false;

  for (const [rr, cc] of group) {
    burst(px(rr, cc), py(rr), col);
    grid[rr][cc] = -1;
  }
  score += group.length * (group.length > BIG_GROUP ? 2 : 1);   // نقطة لكل بالونة، والمجموعة الكبيرة ×2
  // إيموجي يطفو من مكان الفرقعة (أكثر كلما كبرت المجموعة)
  let cx = 0, cy = 0;
  for (const [rr, cc] of group) { cx += px(rr, cc); cy += py(rr); }
  cx /= group.length; cy /= group.length;
  const nE = Math.min(3, 1 + ((group.length - 3) / 3 | 0));
  for (let i = 0; i < nE; i++) {
    emojis.push({
      x: Math.min(W - 26, Math.max(26, cx + (i - (nE - 1) / 2) * 34 + (Math.random() - .5) * 10)),
      y: Math.max(30, cy),
      vx: (Math.random() - .5) * .8, vy: -1.6 - Math.random() * .8,
      t: 0, life: 62 + i * 6, e: FACES[Math.random() * FACES.length | 0]
    });
  }
  sndPops(group.length); combo++;

  // البالونات التي فقدت اتصالها بالسقف تسقط
  const hang = new Set(), q = [];
  for (let cc = 0; cc < cols(0); cc++) if (grid[0][cc] >= 0) { hang.add(cc); q.push([0, cc]); }
  for (let i = 0; i < q.length; i++) {
    for (const [rr, cc] of nbrs(...q[i])) {
      const k = rr * 100 + cc;
      if (grid[rr][cc] >= 0 && !hang.has(k)) { hang.add(k); q.push([rr, cc]); }
    }
  }
  let dropped = 0;
  for (let rr = 0; rr < MAXR; rr++) for (let cc = 0; cc < cols(rr); cc++) {
    if (grid[rr][cc] >= 0 && !hang.has(rr * 100 + cc) && !(rr === 0)) {
      falls.push({ x: px(rr, cc), y: py(rr), vy: -2 + Math.random(), ci: grid[rr][cc] });
      grid[rr][cc] = -1; dropped++;
    }
  }
  score += dropped;                              // نقطة واحدة لكل بالونة تسقط
  const popT = Math.min(group.length, 12) * (group.length > 8 ? .06 : .085) + .1;
  if (dropped) sndDrops(dropped, popT);
  if (combo >= 2) sndCombo(combo, popT + (dropped ? Math.min(dropped, 8) * .06 + .12 : 0));
  return true;
}

function pushRow() {
  const p = present();
  const pool = p.length ? p : [0];
  parity ^= 1;
  grid.unshift(new Array(cols(0)).fill(-1));
  grid.pop();
  for (let c = 0; c < cols(0); c++) grid[0][c] = pickColor(0, c, pool);
  snd(160, .2, 'square', .05);
}

function land() {
  const cell = snap(proj.x, proj.y);
  const color = proj.c;
  proj = null;
  if (!cell) { return gameOver(); }
  const [r, c] = cell;
  grid[r][c] = color;
  if (!resolve(r, c)) {
    combo = 0; sweep(260, 110, .13, 'sine', .14);
    if (++shots >= dropEvery()) { shots = 0; pushRow(); }
  }
  if (!present().length) return levelWon();
  for (let rr = LOSE_ROW; rr < MAXR; rr++)
    if (grid[rr].some(v => v >= 0)) return gameOver();

  cur = nxt;
  if (!present().includes(cur)) cur = rndColor();
  nxt = rndColor();
  state = 'ready';
  hud();
}

const cf = $('conf'), cfx = cf.getContext('2d');
cf.width = W * dpr; cf.height = H * dpr;
let confetti = [], confRun = false, confTimers = [];
function confettiBurst(x, y, n, base, spread) {
  for (let i = 0; i < n; i++) {
    const a = base + (Math.random() - .5) * spread, s = 4 + Math.random() * 8;
    confetti.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: Math.random() * 6.283, vr: (Math.random() - .5) * .4,
      w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: PAL[Math.random() * PAL.length | 0][0],
      life: 1, dec: .011 + Math.random() * .009
    });
  }
  if (!confRun) { confRun = true; requestAnimationFrame(confFrame); }
}
function confFrame() {
  cfx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cfx.clearRect(0, 0, W, H);
  for (const p of confetti) { p.vx *= .985; p.vy += .2; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= p.dec; }
  confetti = confetti.filter(p => p.life > 0 && p.y < H + 20);
  for (const p of confetti) {
    cfx.save(); cfx.translate(p.x, p.y); cfx.rotate(p.r);
    cfx.globalAlpha = Math.min(1, p.life * 1.6); cfx.fillStyle = p.c;
    cfx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cfx.restore();
  }
  if (confetti.length || confTimers.length) requestAnimationFrame(confFrame);
  else { confRun = false; cfx.clearRect(0, 0, W, H); }
}
let winTimer = null;
function showWin(next) {

  confTimers.push(setTimeout(() => confettiBurst(30, H - 60, 45, -Math.PI / 2 + .55, 1.1), 280));

}

const MILES = [50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000];

function setBar(id, f) { $(id).style.width = Math.round(Math.min(1, Math.max(0, f)) * 100) + '%'; }
/* اختصار الأرقام: حتى ٩٩٩ كما هي، ثم 1k و1.1k و1.2k ... ثم 1M */
function fmt(n) {

  if (n < 1000) return String(n);
  const unit = n >= 1e6 ? 'M' : 'k', base = n >= 1e6 ? 1e6 : 1e3;
  const v = Math.floor(n / base * 10) / 10;          // كسر عشري واحد بدون تقريب لأعلى
  return (v % 1 ? v.toFixed(1) : String(v)) + unit;
}

/* ---------- الصوت ---------- */
let ac, master;
/* مخرج الصوت: تضخيم عام + ضاغط يمنع التشويه، ويستأنف السياق إن أوقفه المتصفح */
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 8;
    comp.attack.value = .003; comp.release.value = .2;
    master = ac.createGain(); master.gain.value = 3.5;
    master.connect(comp); comp.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function snd(f, d = .09, type = 'triangle', v = .08) {
  if (muted) return;
  try {
    audio();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * .4, t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}

/* نغمات متتابعة (للفوز والخسارة) */
function tune(freqs, step = .11, d = .2, type = 'triangle', v = .07, delay = 0) {
  if (muted) return;
  try {
    audio();
    const t0 = ac.currentTime + .02 + delay;
    freqs.forEach((f, i) => {
      const t = t0 + i * step, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + .015);
      g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + d + .02);
    });
  } catch (e) {}
}
/* «بوق» فقاعة: نغمة مستديرة تنزلق للأعلى بسرعة ثم تخفت (بلا نقرة حادة) */
function sndBubble(delay = 0, f = 480) {
  if (muted) return;
  try {
    audio();
    const t = ac.currentTime + .005 + delay, d = .16;
    [[1, .34], [2, .07]].forEach(([mul, vol]) => {                       // أساسية + توافقية خفيفة لجسم الصوت
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f * .72 * mul, t);
      o.frequency.exponentialRampToValueAtTime(f * 1.45 * mul, t + .085);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .012);
      g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);
    });
  } catch (e) {}
}
function sndPop(delay = 0) { sndBubble(delay, 400 + Math.random() * 120); }
const sndWin  = () => { sndBubble(0, 400); sndBubble(.11, 500); sndBubble(.22, 620); tune([523, 659, 784, 1047], .11, .22, 'triangle', .07, .4); };  // فرقعات ثم دو مي صول دو
const sndTrophy = () => tune([523, 659, 784, 1047, 784, 1047, 1319], .13, .26);     // ختام اللعبة
const sndLose = () => tune([392, 370, 330, 262], .17, .3, 'triangle', .08);         // نغمات هابطة
document.addEventListener('visibilitychange', () => {        // إيقاف الصوت عند الخروج من التطبيق
  if (!ac) return;

});

/* ---------- أصوات تفاعلية: تتغير حسب ما يحدث في اللعب ---------- */
function sweep(f0, f1, d = .12, type = 'sine', v = .08, delay = 0) {     // نغمة تنزلق من تردد لآخر
  if (muted) return;
  try {
    audio();
    const t = ac.currentTime + .005 + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const SCALE = [0, 2, 4, 7, 9];                                            // سلّم خماسي: كل فرقعة نغمة أعلى
function sndPops(n) {                                                      // فرقعة لكل بالونة بنغمة صاعدة
  const m = Math.min(n, 12), step = n > 8 ? .06 : .085;                    // بوق، بوق، بوق...
  for (let i = 0; i < m; i++) {
    const f = 330 * Math.pow(2, (SCALE[i % 5] + 12 * ((i / 5) | 0)) / 12);
    sndBubble(i * step, Math.min(f, 1500));
  }
}
function sndDrops(n, delay) {                                              // البالونات الساقطة: قطرات هابطة
  for (let i = 0; i < Math.min(n, 8); i++) sweep(1000 - i * 50, 420 - i * 20, .16, 'sine', .09, delay + i * .06);
}
function sndCombo(c, delay) {                                              // تتابع الإصابات: جرس يعلو مع كل إصابة
  const base = 659 * Math.pow(2, (Math.min(c, 9) - 2) * 2 / 12);
  tune([base, base * 1.25, base * 1.5], .07, .18, 'sine', .08, delay);
}

let sky;

/* صور البالونات تُرسم مرة واحدة عند البدء ثم تُنسخ في كل إطار (توفير للمعالج والبطارية) */
const SPR_D = R * 2 + 2;
const SPR = PAL.map(([c0, c1]) => {
  const n = Math.ceil(SPR_D * dpr), s = document.createElement('canvas');
  s.width = s.height = n;
  const g = s.getContext('2d'), x = n / 2, y = n / 2, r = (R - 1) * dpr;
  const gr = g.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  gr.addColorStop(0, c0); gr.addColorStop(1, c1);
  g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)';
  g.beginPath(); g.ellipse(x - r * .38, y - r * .42, r * .2, r * .12, -.7, 0, 6.283); g.fill();
  return s;
});
function balloon(x, y, ci, s = 1) {
  const d = SPR_D * s;
  ctx.drawImage(SPR[ci], x - d / 2, y - d / 2, d, d);
}

function trace() {
  let x = SX, y = SY, vx = Math.cos(ang) * 5, vy = -Math.sin(ang) * 5;
  const pts = [];
  const n = diff.guide(level);
  for (let i = 0; i < n; i++) {
    x += vx; y += vy;
    if (x < R) { x = R; vx = -vx; } else if (x > W - R) { x = W - R; vx = -vx; }
    if (collide(x, y)) break;
    if (i % 6 === 0) pts.push([x, y]);
  }
  return pts;
}

/* حلقة الرسم تتوقف في القائمة الرئيسية وتعود عند بدء اللعب */
let looping = false;
function startLoop() { if (!looping) { looping = true; requestAnimationFrame(frame); } }
function frame() {
  if (state === 'menu') { looping = false; return; }
  // تحديث
  if (state === 'flying' && proj) {
    for (let i = 0; i < 4 && proj; i++) {
      proj.x += proj.vx / 4; proj.y += proj.vy / 4;
      if (proj.x < R) { proj.x = R; proj.vx = -proj.vx; sweep(750, 520, .05, 'sine', .09); }
      else if (proj.x > W - R) { proj.x = W - R; proj.vx = -proj.vx; sweep(750, 520, .05, 'sine', .09); }
      if (collide(proj.x, proj.y)) { land(); break; }
    }
  }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .12; p.life -= .035; }
  parts = parts.filter(p => p.life > 0);
  for (const f of falls) { f.vy += .45; f.y += f.vy; }
  falls = falls.filter(f => f.y < H + 30);
  for (const m of emojis) { m.t++; m.x += m.vx; m.y += m.vy; m.vy *= .985; }
  emojis = emojis.filter(m => m.t < m.life);

  // رسم
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  if (grid) {
    for (let r = 0; r < MAXR; r++) for (let c = 0; c < grid[r].length; c++)
      if (grid[r][c] >= 0) balloon(px(r, c), py(r), grid[r][c]);

    // خط الخسارة
    ctx.strokeStyle = 'rgba(255,120,120,.55)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    const ly = py(LOSE_ROW) - R;
    ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke(); ctx.setLineDash([]);

    // التصويب
    if (state === 'ready') {
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for (const [x, y] of trace()) { ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 6.283); ctx.fill(); }
    }

    // المدفع
    ctx.save(); ctx.translate(SX, SY); ctx.rotate(Math.PI / 2 - ang);
    ctx.fillStyle = '#e9e4ff'; ctx.fillRect(-9, -46, 18, 46);
    ctx.fillStyle = '#b9b0e6'; ctx.fillRect(-12, -50, 24, 8);
    ctx.restore();
    ctx.fillStyle = '#2a2455'; ctx.beginPath(); ctx.arc(SX, SY + 8, 34, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#e9e4ff'; ctx.beginPath(); ctx.arc(SX, SY, 14, 0, 6.283); ctx.fill();

    if (state === 'ready') balloon(SX, SY, cur);
    if (proj) balloon(proj.x, proj.y, proj.c);

    // البالونة التالية
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.arc(SWAP.x, SWAP.y, 28, 0, 6.283); ctx.fill();
    balloon(SWAP.x, SWAP.y, nxt, .85);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = '700 13px system-ui, Tahoma, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('تبديل', SWAP.x, SWAP.y + 46);
  }

  if (toast.t > 0) {
    toast.t--;
    ctx.globalAlpha = Math.min(1, toast.t / 30);
    const rr = (x, y, w, h, r) => {
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    };
    ctx.fillStyle = 'rgba(13,24,48,.82)'; rr(W / 2 - 92, 298, 184, 54, 20); ctx.fill();    // لوحة داكنة تُقرأ فوق البالونات
    ctx.fillStyle = '#fff'; ctx.font = '800 23px system-ui, Tahoma, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(toast.text, W / 2, 333);
    ctx.globalAlpha = 1;
  }
  for (const f of falls) balloon(f.x, f.y, f.ci);
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = PAL[p.ci][0];
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.2 * p.life + 1, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (emojis.length) {
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const m of emojis) {
      const k = m.t / m.life;
      const pop = m.t < 10 ? .4 + .9 * (m.t / 10) : 1.3 - .3 * Math.min(1, (m.t - 10) / 14);   // يظهر بنبضة ثم يستقر
      ctx.globalAlpha = k > .65 ? Math.max(0, 1 - (k - .65) / .35) : 1;
      ctx.font = `${Math.round(30 * pop)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.fillText(m.e, m.x, m.y);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  hudTick();
  requestAnimationFrame(frame);
}
let lastScore = -1;
function hudTick() { if (score !== lastScore) { lastScore = score; hud(); } }

/* ---------- الانطلاق ---------- */
score = 0; level = 1; shots = 0; parity = 0;
grid = Array.from({ length: MAXR }, (_, r) => new Array(cols(r)).fill(-1));
cur = 0; nxt = 0;
hud();
ovAction = newGame;
startLoop();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>


<div class="inst" id="inst" hidden role="dialog" aria-label="تثبيت أطلق بوم">
  <div class="card">
    <button class="x" id="instX" type="button" aria-label="إغلاق"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <img src="logo.png" alt="أطلق بوم" width="512" height="512">
    <button class="go" id="instGo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M6.5 10.5 12 16l5.5-5.5"/><path d="M5 20h14"/></svg>تثبيت</button>
  </div>
</div>
<script>
/* نافذة التثبيت: تظهر بعد ثانيتين إذا كان المتصفح يسمح بالتثبيت.
   لا تظهر إن كانت اللعبة مثبّتة، أو داخل إطار المتجر (له نافذته الخاصة)، أو بعد إغلاقها بـ ✕ في نفس الجلسة */
(function(){
  var box=document.getElementById('inst'),go=document.getElementById('instGo'),x=document.getElementById('instX');
  var evp=null,ready=false,closed=false,framed=false;
  var standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  try{framed=window.self!==window.top}catch(e){framed=true}
  try{closed=sessionStorage.getItem('ab_inst_x')==='1'}catch(e){}
  if(standalone||framed||closed)return;
  function show(){if(evp&&ready&&!closed){box.hidden=false;go.focus()}}
  function hide(){box.hidden=true}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();evp=e;show()});
  addEventListener('appinstalled',function(){evp=null;hide()});
  setTimeout(function(){ready=true;show()},2000);
  x.addEventListener('click',function(){closed=true;hide();try{sessionStorage.setItem('ab_inst_x','1')}catch(e){}});
  go.addEventListener('click',function(){
    if(!evp)return;
    var p=evp;evp=null;hide();
    try{p.prompt();p.userChoice.catch(function(){})}catch(e){}
  });
})();
</script>

<div class="splash" id="splash" role="status" aria-label="جارٍ تحميل أطلق بوم">
  <img src="logo.png" alt="شعار أطلق بوم" width="512" height="512">
  <div class="bar" aria-hidden="true"><i id="splashBar"></i></div>
</div>
<script>
(function(){
  var s=document.getElementById('splash'),b=document.getElementById('splashBar'),gone=false;
  function hide(){ if(gone)return; gone=true; s.classList.add('done'); setTimeout(function(){s.remove()},600); }
  b.addEventListener('animationend',hide);
  setTimeout(hide,5400);
})();
</script>
